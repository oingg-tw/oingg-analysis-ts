# Cloud Run「服務」——常駐 HTTP API，對應 Dockerfile 預設的 CMD（node dist/src/index.js）。
# 部署：gcloud run services replace deploy/service.yaml --region=asia-southeast1 --project=oingg-analysis
# 2026-09-28 使用者拍板：專案 oingg-analysis、地區 asia-southeast1（新加坡，跟 Neon 資料庫同區——台灣到資料庫實測每次查詢
# 約 59 毫秒、一個請求查 10~30 次；台灣使用者只多 bff→analysis 一跳）；只允許授權帳號呼叫（不綁 allUsers，bff-ts 用自己的
# 服務帳號帶 ID token 呼叫，並照舊帶 X-Api-Key）；執行帳號 oingg-analysis-run 只能讀下面這幾把密鑰。
#
# 密鑰名稱跟 .env 變數同名、底線改連字號（Secret Manager 名稱不能用底線）；ANALYSIS-DATABASE-URL 指向 PRD 分支。
# 映像：gcloud builds submit --tag asia-southeast1-docker.pkg.dev/oingg-analysis/oingg/oingg-analysis-ts:latest --project=oingg-analysis
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: oingg-analysis-ts
  labels:
    cloud.googleapis.com/location: asia-southeast1
spec:
  template:
    metadata:
      annotations:
        # 冷啟動時要連 6 個資料庫（見 src/index.ts 的 connectXxxDb 系列呼叫；MOPS/TWSE/GOV 的
        # owner 帳號已於 2026-09-03 退場，全部改走 etl_reader export schema），本機實測開發模式
        # 啟動要 3~5 秒，正式環境保守抓大一點，避免健康檢查太早判定失敗。
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      serviceAccountName: oingg-analysis-run@oingg-analysis.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 30
      containers:
        - image: asia-southeast1-docker.pkg.dev/oingg-analysis/oingg/oingg-analysis-ts:latest
          ports:
            - containerPort: 8080
          # 健康檢查固定打 GET /（src/domains/system/root.ts），不要用 /healthz——
          # 那是 Cloud Run 保留路徑，見 src/index.ts、Dockerfile 的說明。
          startupProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 2
            failureThreshold: 10
          resources:
            limits:
              cpu: '1'
              # 2026-09-24 從 512Mi 調高。**Node 的 V8 old-space 上限是從容器記憶體推算的（約一半）**，
              # 所以 512Mi 容器的 heap 天花板只有約 260MB，不是把 memory 調大就會跟著變大——
              # sitca-ts 在 prod 實測到這個關係（1Gi 容器只用到 55% 就
              # FATAL ERROR: Ineffective mark-compacts near heap limit）。
              # 我們本機同性質的批次實測 RSS 317~343MB，已經越過 512Mi 的 heap 天花板。
              #
              # 兩個上限必須一起設，只調一個會把一種 OOM 換成另一種：
              #   memory                        管 RSS（容器層級）
              #   NODE_OPTIONS --max-old-space-size  管 V8 heap，單位 MB
              #
              # 這裡的 768 + 1Gi **沒有 prod 量測支撐**——是照 sitca-ts 實測可行的 768 + 2Gi
              # 按負載比例縮下來的。部署後要實際量一次再決定調降或調高。
              memory: 1Gi
          env:
            - name: NODE_OPTIONS
              value: --max-old-space-size=768
            - name: NODE_ENV
              value: production
            # 2026-09-28：正式環境沒有 BFF_API_KEY 會拒絕啟動（src/infrastructure/config.ts）；正式環境另發一把，跟 dev 分開，
            # bff-ts 的服務帳號被授權直接讀這把密鑰（跨專案），值不經過任何訊息。
            - name: BFF_API_KEY
              valueFrom:
                secretKeyRef:
                  name: BFF-API-KEY
                  key: latest
            # *_DIRECT_URL 只有 prisma CLI（migrate）用，執行期不讀，2026-09-28 從這裡拿掉，少掛幾把密鑰。
            - name: ANALYSIS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ANALYSIS-DATABASE-URL
                  key: latest
            - name: MOPS_EXPORT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: MOPS-EXPORT-DATABASE-URL
                  key: latest
            - name: GOV_EXPORT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: GOV-EXPORT-DATABASE-URL
                  key: latest
            # tpex-ts/sitca-ts 的 export 連線是 dev/prod 分開兩個變數（見 .env），Cloud Run
            # 上只會用到 _PROD 那組，_DEV 那組不用設。
            - name: TPEX_EXPORT_DATABASE_URL_PROD
              valueFrom:
                secretKeyRef:
                  name: TPEX-EXPORT-DATABASE-URL-PROD
                  key: latest
            - name: SITCA_EXPORT_DATABASE_URL_PROD
              valueFrom:
                secretKeyRef:
                  name: SITCA-EXPORT-DATABASE-URL-PROD
                  key: latest
            # 2026-09-03 新增：twse-ts 開的獨立 export schema 專案（實體隔離，不是同專案換角色，
            # 見 prisma/twseExport/schema.prisma 的說明）——2026-09-28 密鑰已建，
            # 部署前要先用 gcloud secrets create 建好，不然 Cloud Run 啟動會因為讀不到密鑰失敗。
            - name: TWSE_EXPORT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: TWSE-EXPORT-DATABASE-URL
                  key: latest
