# Cloud Run「工作」——排程觸發、跑一次就結束，對應 Dockerfile 的
# node dist/scripts/syncCuratedDatasets.js（見 package.json 的 sync:curated）。
# 跟 service.yaml 用同一個映像檔，只是 command/args 不同、不需要對外開 port。
#
# 部署：gcloud run jobs replace deploy/job.yaml --region=REGION --project=PROJECT_ID
# 排程：這份 YAML 本身不會自動跑，要另外用 Cloud Scheduler 觸發（Cloud Run Job 沒有內建
# cron，這點跟 Service 不一樣），部署完 Job 之後執行一次（把 REGION/PROJECT_ID/JOB 換成
# 實際值，SCHEDULE 用 cron 表達式，例如 "0 20 * * *" 是每天台北時間凌晨 4 點——
# Cloud Scheduler 預設用 UTC，記得換算或用 --time-zone 指定）：
#
#   gcloud scheduler jobs create http oingg-analysis-ts-sync \
#     --location=REGION \
#     --schedule="SCHEDULE" \
#     --time-zone="Asia/Taipei" \
#     --uri="https://REGION-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/PROJECT_ID/jobs/oingg-analysis-ts-sync:run" \
#     --http-method=POST \
#     --oauth-service-account-email=SCHEDULER_SERVICE_ACCOUNT@PROJECT_ID.iam.gserviceaccount.com
#
# SCHEDULER_SERVICE_ACCOUNT 這個服務帳號要有 roles/run.invoker 權限才能觸發這個 Job，
# 這權限要另外在 GCP IAM 設定，不在這份 YAML 裡。
#
# 這個 Job 只需要 syncCuratedDatasets.ts 實際會連的 4 條連線（見該檔案的 import：
# prisma 根 schema、analysisPrisma、mopsExportPrisma、govExportPrisma）——不是
# service.yaml 那份完整清單，TWSE/GOV（非 export）/TPEX_EXPORT/SITCA_EXPORT 這次用不到，
# 故意不給，縮小這個元件實際碰得到的密鑰範圍。
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: oingg-analysis-ts-sync
  labels:
    cloud.googleapis.com/location: REGION # TODO
spec:
  template:
    spec:
      template:
        spec:
          # 跑一次就結束，失敗不要一直重試——sync 是 watermark-based（見
          # scripts/syncCuratedDatasets.ts 的說明），下次排程觸發會自動從上次沒同步完的
          # 地方接著做，不需要 Cloud Run Job 自己重試同一次執行。
          maxRetries: 0
          timeoutSeconds: 600
          containers:
            - image: REGION-docker.pkg.dev/PROJECT_ID/oingg/oingg-analysis-ts:latest # TODO
              command: ['node']
              args: ['dist/scripts/syncCuratedDatasets.js']
              resources:
                limits:
                  cpu: '1'
                  memory: 512Mi
              env:
                - name: NODE_ENV
                  value: production
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: DATABASE-URL # TODO：Secret Manager 密鑰名稱，跟 service.yaml 共用同一份
                      key: latest
                - name: DIRECT_URL
                  valueFrom:
                    secretKeyRef:
                      name: DIRECT-URL
                      key: latest
                - name: ANALYSIS_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: ANALYSIS-DATABASE-URL
                      key: latest
                - name: ANALYSIS_DIRECT_URL
                  valueFrom:
                    secretKeyRef:
                      name: ANALYSIS-DIRECT-URL
                      key: latest
                - name: MOPS_EXPORT_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: MOPS-EXPORT-DATABASE-URL
                      key: latest
                - name: MOPS_EXPORT_DIRECT_URL
                  valueFrom:
                    secretKeyRef:
                      name: MOPS-EXPORT-DIRECT-URL
                      key: latest
                - name: GOV_EXPORT_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: GOV-EXPORT-DATABASE-URL
                      key: latest
                - name: GOV_EXPORT_DIRECT_URL
                  valueFrom:
                    secretKeyRef:
                      name: GOV-EXPORT-DIRECT-URL
                      key: latest
